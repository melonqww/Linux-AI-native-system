[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-native-linux-security-center"
version = "0.3.0"
description = "Bounded read-only scanning with an optional local ClamAV adapter."
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]
