[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-native-linux-capability-registry"
version = "0.1.0"
description = "Manifest validation and capability lifecycle registry for AI-native Linux."
requires-python = ">=3.12"

[project.scripts]
ai-native-capabilities = "ai_native_capabilities.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
