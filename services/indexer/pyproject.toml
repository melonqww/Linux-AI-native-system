[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-native-linux-indexer"
version = "0.1.0"
description = "Local, opt-in document indexing and retrieval for AI-native Linux."
requires-python = ">=3.12"

[project.scripts]
ai-native-indexer = "ai_native_indexer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
